spring:
  application:
    name: ai-document-review
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docreview}
    username: ${DB_USER:docreview}
    password: ${DB_PASSWORD:docreview}
  jpa:
    # Fine for learning. Move to Flyway migrations before treating this as production.
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    allowed-content-types:
      - application/pdf
      - text/plain
  ai:
    # stub = free fake AI for building the workflow; claude = real Claude API (needs ANTHROPIC_API_KEY)
    mode: ${AI_MODE:stub}
    model: ${AI_MODEL:claude-opus-5-5}
    max-text-chars: 400000
  # Demo users for local development only. Override the passwords with environment variables.
  users:
    - username: uploader
      password: ${UPLOADER_PASSWORD:uploader-pass}
      roles: [UPLOADER]
    - username: reviewer
      password: ${REVIEWER_PASSWORD:reviewer-pass}
      roles: [REVIEWER]
    - username: admin
      password: ${ADMIN_PASSWORD:admin-pass}
      roles: [ADMIN]

management:
  endpoints:
    web:
      exposure:
        include: health
